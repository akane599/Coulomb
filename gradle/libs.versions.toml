# Every version below was resolved from maven-metadata.xml (Google Maven, Maven Central,
# Gradle Plugin Portal) on 2026-11-06 as the newest stable release (SPEC 0.3.2).
# Non-stable pins need an ADR in docs/adr/.

[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"

compileSdk = "37"
targetSdk = "37"
minSdk = "36"

composeBom = "2026.09.00"
# Pre-stable for the Expressive components (SPEC 11.7, ADR-0030); move to 1.5.0 when it is stable.
material3 = "1.5.0-rc01"
material3Adaptive = "1.3.0"
navigation3 = "1.2.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
hilt = "2.60.1"
androidxHilt = "1.4.0"
room = "2.8.5"
datastore = "1.3.0"
coroutines = "1.11.0"
serialization = "1.12.0"
collectionsImmutable = "0.5.2"
wire = "7.1.2"
okio = "3.18.2"
glance = "1.2.0"
work = "2.12.0"
