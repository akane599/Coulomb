# Builds on detekt's default config (buildUponDefaultConfig = true); only overrides live here.
config:
  validation: true

complexity:
  LongParameterList:
    functionThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # A Room DAO method is one SQL statement, declared rather than written; DAOs need one per table.
    ignoreAnnotatedFunctions: ['Preview', 'Query', 'Insert', 'Update', 'Upsert', 'Delete']
    # Private helpers and interface implementations do not widen a class's API.
    ignorePrivate: true
    ignoreOverridden: true
  # A `when` that only maps one enum to another is a table, not branching logic.
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  # Same limit as ktlint (.editorconfig max_line_length).
  MaxLineLength:
    maxLineLength: 140
  # Early-exit validation (`?: return`, `if (bad) return`) is the house style at trust boundaries.
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  MagicNumber:
    ignoreEnums: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Preview']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    active: false
  # The pre-stable material3 Expressive APIs stay inside :core:designsystem (SPEC 11.7, ADR-0030).
  # Features use its wrappers, so moving the pin touches one module.
  ForbiddenImport:
    active: true
    excludes: ['**/core/designsystem/**']
    imports:
      - value: 'androidx.compose.material3.ExperimentalMaterial3ExpressiveApi'
        reason: 'Expressive APIs are used only in :core:designsystem (ADR-0030).'
      - value: 'androidx.compose.material3.MaterialExpressiveTheme'
        reason: 'Expressive APIs are used only in :core:designsystem (ADR-0030).'
      - value: 'androidx.compose.material3.MotionScheme'
        reason: 'Use CoulombTheme motion from :core:designsystem (ADR-0030).'
      - value: 'androidx.compose.material3.ButtonGroup*'
        reason: 'Use WindowSelector from :core:designsystem (ADR-0030).'
      - value: 'androidx.compose.material3.*ToggleButton*'
        reason: 'Use the :core:designsystem wrappers (ADR-0030).'
      - value: 'androidx.compose.material3.*FloatingToolbar*'
        reason: 'Use the :core:designsystem wrapper (ADR-0030).'
      - value: 'androidx.compose.material3.*LoadingIndicator*'
        reason: 'Use the :core:designsystem wrapper (ADR-0030).'
      - value: 'androidx.compose.material3.*WavyProgressIndicator*'
        reason: 'Use the :core:designsystem wrapper (ADR-0030).'
      - value: 'androidx.compose.material3.MaterialShapes'
        reason: 'Shape morph is only for the charging glyph in :core:designsystem (ADR-0030).'

# Compose rules 0.6.8 defaults (copied from the jar), with UnstableCollections on (SPEC 15.5).
Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableNestingDepth:
    active: false
  ComposableParamOrder:
    active: true
  CompositionLocalAllowlist:
    active: true
  CompositionLocalNaming:
    active: true
  ConditionHoist:
    active: true
  ContentEmitterReturningValues:
    active: true
  ContentSlotReused:
    active: true
  ContentTrailingLambda:
    active: true
  DefaultsVisibility:
    active: true
  InvalidReadOnlyComposable:
    active: true
  LambdaParameterEventTrailing:
    active: true
  LambdaParameterInRestartableEffect:
    active: true
  Material2:
    active: false
  MissingNonRestartableComposable:
    active: true
    # -- Ignore direct and custom @Preview composables (default: true)
    # ignoresPreviews: true
  MissingReadOnlyComposable:
    active: true
  ModifierClickableOrder:
    active: true
  ModifierComposed:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierShouldBeForwardedToEveryBranch:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewNaming:
    active: false
  PreviewPublic:
    active: true
  RememberContentMissing:
    active: true
  RememberMissing:
    active: true
  StaleRememberUpdatedStateInRemember:
    active: true
  StateParam:
    active: true
  UnnecessaryComposable:
    active: true
  UnnecessaryLaunchedEffect:
    active: true
    # -- Calls whose dispatch or extension receiver has one of these fully qualified types keep LaunchedEffect.
    # allowedCallReceiverTypes:
    #   - androidx.compose.ui.focus.FocusRequester
    # -- Calls whose fully qualified name is listed here keep LaunchedEffect.
    # allowedCallNames:
    #   - androidx.compose.ui.focus.FocusRequester.requestFocus
  UnstableCollections:
    active: true
  VarsWithoutStateBacking:
    active: true
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
