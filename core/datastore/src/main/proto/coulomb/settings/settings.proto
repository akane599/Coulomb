syntax = "proto3";

package coulomb.settings;

option java_package = "io.github.akane599.coulomb.core.datastore.proto";

// The user's settings (SPEC 14.4). A field's zero value is its default, so a new field needs no
// migration; a removed field's number is reserved, never reused.
message Settings {
  // "Show system apps in Drain": Off.
  bool show_system_apps = 1;
  // "Scale attribution to measured": Off; scaled figures are Derived.
  bool scale_to_measured = 2;
  // "Component breakdown" (ADR-0035 §2): Off until the phone shows what S4 costs.
  bool component_breakdown = 3;
  // The charge target (SPEC 14.4, ADR-0046 §4): 50-100; 0 is the suggested 80.
  int32 charge_target_pct = 4;
  // Onboarding finished (ADR-0047 §1); until then the app opens onboarding.
  bool onboarded = 5;
  // "Charge target alarm" (SPEC 12.3, 14.4): Off.
  bool charge_alarm = 6;
  // "Temperature alarm" (SPEC 14.4) in tenths of a degree, 380-500; 0 is the default 42 °C, -1 is off.
  sint32 temperature_alarm_deci_c = 7;
  // "Insights digest" (SPEC 14.4): On, so the field stores "off".
  bool insights_digest_off = 8;
  // The digest's minute of the day plus one; 0 is the default 09:00.
  int32 insights_digest_minute_plus_one = 9;
  // "Action Center" (SPEC 14.4): Off.
  bool action_center = 10;
  // "Theme" (SPEC 14.4): 0 System, 1 Light, 2 Dark, 3 True black.
  int32 theme = 11;
  // "Units" (SPEC 14.4): temperatures in °F; Off is °C.
  bool fahrenheit = 12;
  // "Monitoring mode" (SPEC 7.1, 14.4): Lite; Off is Full.
  bool lite_mode = 13;
  // "Screen-on sampling" (SPEC 14.4) in seconds while a Coulomb screen is visible, 2-60; 0 is the default 5.
  int32 screen_on_sampling_s = 14;
  // "Data retention" (SPEC 14.4): raw samples kept longer than SPEC 7.7's 14 days.
  bool long_raw_retention = 15;
  // "Developer console" (SPEC 14.4): unlocked by tapping the version seven times.
  bool developer_console = 16;
  // "Automation API" (SPEC 12.7, 14.4): Off.
  bool automation = 17;
}
