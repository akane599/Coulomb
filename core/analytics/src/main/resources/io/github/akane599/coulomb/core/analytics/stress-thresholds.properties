#
# SPEC 6.4 wear stress thresholds. Each factor scores Low below its moderate value, Moderate from
# it, and High from its high value; a session's stress index is its highest factor.
minutesAtOrAbove80.moderate=60
minutesAtOrAbove80.high=240
# Tenths of a degree Celsius.
peakTempDeciC.moderate=380
peakTempDeciC.high=430
# Current over estimated capacity, per hour.
cRate.moderate=0.7
cRate.high=1.2
