# SPEC 15.6: build, unit and parser golden tests, screenshot diff, detekt, lint,
# manifest permission check, release assemble. Screenshot diff joins in P3/P4 when screens exist.
name: CI

# GitHub-hosted runners only. While the repository is private, CI runs on pull requests and manual
# dispatch; once it is public, add a `push` trigger for `main` with the same paths-ignore
# (owner decision 2026-11-06). Every push is preceded by tools/ci/check.sh on the build server.
on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Static analysis (spotless/ktlint, detekt, module boundaries)
        run: tools/ci/check.sh static

      - name: Unit tests (incl. build-logic checks)
        run: tools/ci/check.sh unit

      - name: Android Lint (warnings as errors)
        run: tools/ci/check.sh lint

      - name: Manifest permission check (no INTERNET)
        run: tools/ci/check.sh manifest

      - name: Assemble debug, release and benchmark
        run: tools/ci/check.sh assemble

      - name: Permission report
        if: always()
        run: cat app/build/reports/permissions/release.txt || true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            !**/build/reports/configuration-cache/
          retention-days: 7
